services:
  postgres:
    image: postgres:16-alpine
    container_name: lh_nautical_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecret}
      POSTGRES_DB: ${POSTGRES_DB:-challenge_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-challenge} -d $${POSTGRES_DB:-challenge_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:

